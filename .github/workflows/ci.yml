name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 22.23.2
            label: 22.x
          - node: 24.19.0
            label: 24.x
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Enforce native coverage thresholds
        if: matrix.label == '24.x'
        run: npm run test:coverage

      - name: Assert the protocol demo result
        if: matrix.label == '24.x'
        run: npm run demo:check

  artifacts:
    name: Contracts and configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(git ls-files -z -- '*.js' '*.cjs' '*.mjs')

      - name: Validate contract schemas and fixtures
        run: npm run test:contracts

      - name: Validate tracked JSON artifacts
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import { readFile } from "node:fs/promises";

          const files = execFileSync("git", ["ls-files", "-z", "--", "*.json"], { encoding: "utf8" })
            .split("\0")
            .filter(Boolean);
          for (const file of files) {
            JSON.parse(await readFile(file, "utf8"));
            console.log(`validated ${file}`);
          }
          NODE

      - name: Validate optional Codex TOML template
        shell: bash
        run: |
          if [[ -f mcp/codex.config.toml.example ]]; then
            python3 - <<'PY'
          from pathlib import Path
          import tomllib

          tomllib.loads(Path("mcp/codex.config.toml.example").read_text(encoding="utf-8"))
          print("validated mcp/codex.config.toml.example")
          PY
          else
            echo "Codex TOML template not present on this revision; skipping."
          fi

      - name: Audit dependencies
        run: npm audit --audit-level=high

  containers:
    name: Submodules and containers
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate and initialize pinned submodules
        shell: bash
        run: |
          bash scripts/ci/verify-submodules.sh --metadata-only
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1
          bash scripts/ci/verify-submodules.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Verify gitlinks, build ScorpioFS, and smoke-test Mega
        shell: bash
        run: bash scripts/ci/core-container-smoke.sh
