name: Trusted FUSE smoke

on:
  workflow_dispatch:
    inputs:
      mount_path:
        description: Mega monorepo path that ScorpioFS should mount
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: trusted-fuse-smoke
  cancel-in-progress: false

jobs:
  fuse-smoke:
    name: ScorpioFS FUSE mount
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: trusted-fuse
    runs-on: [self-hosted, linux, x64, fuse, ephemeral]
    timeout-minutes: 60
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1

      - name: Validate and initialize pinned submodules
        shell: bash
        run: |
          bash scripts/ci/verify-submodules.sh --metadata-only
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1
          bash scripts/ci/verify-submodules.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and exercise a real FUSE mount
        shell: bash
        env:
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SCORPIO_CI_MOUNT_PATH: ${{ inputs.mount_path }}
        run: bash scripts/ci/fuse-smoke.sh
